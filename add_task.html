<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task - Join</title>

    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="./assets/styles/style.css">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <link rel="stylesheet" href="./assets/styles/components.css">
    <link rel="stylesheet" href="./assets/styles/layout.css">
    <link rel="stylesheet" href="./assets/styles/addTask.css">

    <script src="./assets/js/script.js"></script>
</head>

<body onload="init()">
    <header w3-include-html=".\assets\templates\header.html"></header>

    <div class="main-container">
        <div w3-include-html=".\assets\templates\side-menu.html"></div>

        <main class="add-task-content">
            <h1>Add Task</h1>

            <form class="add-task-form">
                <div class="form-columns">
                    <div class="form-left-column">

                        <div class="form-group error">
                            <label class="txt" for="title">Title<span class="required">*</span></label>
                            <input type="text" id="title" placeholder="Enter a title" required>
                            <span class="error-message">This field is required</span>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" placeholder="Enter a Description"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="assigned">Assigned to</label>
                            <div class="select-wrapper">
                                <select id="assigned">
                                    <option value="">Select contacts to assign</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="separator"></div>

                    <div class="form-right-column">
                        <div class="form-group error">
                            <label for="dueDate">Due date<span class="required">*</span></label>
                            <input type="date" id="dueDate" required>
                            <span class="error-message">This field is required</span>
                        </div>

                        <div class="form-group">
                            <label>Prio</label>
                            <div class="priority-buttons">
                                <button type="button" class="priority-btn" data-priority="urgent">
                                    Urgent
                                    <img src="./assets/icons/prio-urgent.svg" alt="Urgent priority">
                                </button>
                                <button type="button" class="priority-btn active" data-priority="medium">
                                    Medium
                                    <img src="./assets/icons/prio-medium.svg" alt="Medium priority">
                                </button>
                                <button type="button" class="priority-btn" data-priority="low">
                                    Low
                                    <img src="./assets/icons/prio-low.svg" alt="Low priority">
                                </button>
                            </div>
                        </div>

                        <div class="form-group error">
                            <label for="category">Category<span class="required">*</span></label>
                            <div class="select-wrapper">
                                <select id="category" required>
                                    <option value="">Select task category</option>
                                    <option value="work">Work</option>
                                    <option value="personal">Personal</option>
                                    <option value="project">Project</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <span class="error-message">This field is required</span>
                        </div>

                        <div class="form-group">
                            <label>Subtasks</label>
                            <div class="subtask-input">
                                <input type="text" placeholder="Add new subtask">
                                <button type="button" class="add-subtask-btn">+</button>
                            </div>
                            <div class="subtasks-list"></div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary">
                        Clear
                        <img src="./assets/img/cancel.svg" alt="Clear form">
                    </button>
                    <button type="submit" class="btn-primary">
                        Create Task
                        <img src="./assets/img/check.svg" alt="Create task">
                    </button>
                </div>
                <label><span class="required">*</span><span class="span_txt">This field is required</span></label>
            </form>
        </main>
    </div>
</body>

</html>
