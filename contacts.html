<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacts - Join</title>

    <link
      rel="shortcut icon"
      href="./assets/icons/favicon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./assets/styles/fonts.css" />
    <link rel="stylesheet" href="./assets/styles/components.css" />
    <link rel="stylesheet" href="./assets/styles/layout.css" />
    <link rel="stylesheet" href="./assets/styles/contacts.css" />
    <link rel="stylesheet" href="./assets/styles/style.css" />

    <script src="./assets/js/script.js"></script>
  </head>

  <body onload="init()">
    <header w3-include-html=".\assets\templates\header.html"></header>
    <div class="main-container">
      <div w3-include-html=".\assets\templates\side-menu.html"></div>

      <div class="overlay">
        <div class="overlay-left">
          <div class="logo1">
            <img
              class="logoInnerOverlay"
              src="./assets/icons/Logo-side-bar.png"
              alt=""
            />
          </div>
          <h1>Add contact</h1>
          <p>Tasks are better with a team!</p>
          <hr />
        </div>
        <div class="overlay-right">
          <div class="close-btn">×</div>
          <div class="form-container">
            <div class="avatar">
              <i class="icon-person"></i>
            </div>
            <form>
              <div class="form-group">
                <input type="text" placeholder="Name" required />
                <i class="icon-user"></i>
              </div>
              <div class="form-group">
                <input type="email" placeholder="Email" required />
                <i class="icon-email"></i>
              </div>
              <div class="form-group">
                <input type="tel" placeholder="Phone" required />
                <i class="icon-phone"></i>
              </div>
              <div class="button-group">
                <button type="button" class="cancel-btn">Cancel</button>
                <button type="submit" class="create-btn">Create contact</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="contacts-content">
        <div class="contact-list">
          <button class="add-contact-btn">
            Add new contact
            <img src="./assets/icons/person_add.png" alt="Add contact" />
          </button>
          <div class="contact-sections">
            <div class="contact-section">
              <div class="section-header">A</div>
              <div class="contact-divider"></div>

              <div class="contact">
                <div class="contact-avatar" style="background-color: #ff7a00">
                  <span>AM</span>
                </div>
                <div class="contact-details">
                  <span class="contact-name">Anton Mayer</span>
                  <span class="contact-email">anton@gmail.com</span>
                </div>
              </div>

              <div class="contact">
                <div class="contact-avatar" style="background-color: #9327ff">
                  <span>AS</span>
                </div>
                <div class="contact-details">
                  <span class="contact-name">Anja Schulz</span>
                  <span class="contact-email">schulz@hotmail.com</span>
                </div>
              </div>
            </div>

            <div class="contact-section">
              <div class="section-header">B</div>
              <div class="contact-divider"></div>

              <div class="contact">
                <div class="contact-avatar" style="background-color: #6e52ff">
                  <span>BZ</span>
                </div>
                <div class="contact-details">
                  <span class="contact-name">Benedikt Ziegler</span>
                  <span class="contact-email">benedikt@gmail.com</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="contact-info">
          <div class="contact-info-header">
            <h1>Contacts</h1>
            <div class="header-divider"></div>
            <span class="header-subtitle">Better with a team</span>
          </div>
          <div class="contact-details">
            <div class="profile-section">
              <div
                class="contact-avatar large"
                style="background-color: #ff7a00"
              >
                <span>AM</span>
              </div>

              <div class="profile-info">
                <h2>Anton Mayer</h2>
                <div class="profile-actions">
                  <button class="action-link" onclick="editContact()">
                    <img
                      src="./assets/icons/edit.svg"
                      alt=""
                      class="action-icon"
                    />
                    Edit
                  </button>
                  <button onclick="deleteContact()" class="action-link">
                    <img
                      src="./assets/icons/delete.svg"
                      alt=""
                      class="action-icon"
                    />
                    Delete
                  </button>
                </div>
              </div>
            </div>

            <!-- Contact Information -->
            <div class="contact-information">
              <h3>Contact Information</h3>

              <div class="info-group">
                <label class="info-label">Email</label>
                <a href="mailto:anton@gmail.com" class="info-value"
                  >antom@gmail.com</a
                >
              </div>

              <div class="info-group">
                <label class="info-label">Phone</label>
                <a href="tel:+491111111111" class="info-value phone"
                  >+49 1111 111 11 1</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
