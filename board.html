<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board - Join</title>

    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <link rel="stylesheet" href="./assets/styles/style.css">
    <link rel="stylesheet" href="./assets/styles/components.css">
    <link rel="stylesheet" href="./assets/styles/layout.css">

    <link rel="stylesheet" href="./assets/styles/addTask-layouts.css">
    <link rel="stylesheet" href="./assets/styles/addTask-components.css">
    <link rel="stylesheet" href="./assets/styles/addTask-form.css">
    <link rel="stylesheet" href="./assets/styles/contact-dropdown.css">

    <link rel="stylesheet" href="./assets/styles/board.css">
    <link rel="stylesheet" href="./assets/styles/boardOverlays.css">
    <link rel="stylesheet" href="./assets/styles/boardOverlaysResponsive.css">
    <link rel="stylesheet" href="./assets/styles/boardResponsive.css">

    <script src="./assets/js/script.js"></script>
    <script src="./assets/js/db.js"></script>
    <script src="./assets/js/db.board.js"></script>
    <script src="./assets/js/db.tasks.js"></script>
    <script src="./assets/js/db.contacts.js"></script>
    <script src="./assets/js/db.users.js"></script>
    <script src="./assets/js/board.js"></script>
    <script src="./assets/js/board.dnd.js"></script>
    <script src="./assets/templates/boardTemplate.js"></script>
    <script src="./assets/templates/boardOverlayTemplate.js"></script>

    <script src="./assets/js/contactManager.js"></script>
    <script src="./assets/js/subtaskManager.js"></script>
    <script src="./assets/js/taskFormValidation.js"></script>
    <script src="./assets/js/addTask.js"></script>
    <script src="./assets/js/notification.js"></script>
    <script src="./assets/js/customDropdown.js"></script>
</head>

<body onload="initAddTask(); initBoard()">
    <header w3-include-html=".\assets\templates\header.html"></header>
    <div class="main-container">
        <div w3-include-html=".\assets\templates\side-menu.html"></div>

        <div id="overlayAddTask" class="overlay-background dNone">
            <div class="overlay-addTask">
                <div w3-include-html="./add-task.html#addTask-html-content"></div>
            </div>
        </div>
        <div id="editTaskDetails" class="overlay-background dNone"></div>
        <div id="taskDetails" class="overlay-background dNone"></div>
        <div class="overlay dNone" id="overlay">
            <div class="message">
              Task deleted
            </div>
        </div>

        <div class="board-content">
            <div class="board-title d-flex align-items-center">
                <span class="f1">Board</span>
                <div class="dFlex">
                    <div class="board-title-search">
                        <input oninput="updateFilter(event)" id="board-filter-text" type="text" placeholder="Find Task"
                            class="search-input" autocomplete="off">
                        <img id="board-filter-text-icon" onclick="resetFilter()" src="./assets/icons/search.svg" alt=""
                            class="search-icon">
                    </div>
                    <div>
                        <button id="board-task-add-1" onclick="showAddTaskOverlay()" class="addTaskBtn f6">Add task <img
                                src="./assets/icons/add.svg" class="boardIconAdd" alt=""></button>
                        <button id="board-task-add-2" onclick="showAddTaskOverlay()" class="addTaskBtn f6"><img
                                    src="./assets/icons/add.svg" class="boardIconAdd" alt=""></button>
                    </div>
                </div>
            </div>
            <div class="board-title-search2">
                <input oninput="updateFilter(event)" id="board-filter-text2" type="text" placeholder="Find Task"
                    class="search-input" autocomplete="off">
                <img id="board-filter-text-icon2" onclick="resetFilter()" src="./assets/icons/search.svg" alt=""
                    class="search-icon">
            </div>
            <div id="boards-container" class="board-contents d-flex justify-content-start">
                

            </div>
        </div>
    </div>
</body>

</html>
