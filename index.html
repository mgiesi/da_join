<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Join</title>
  <link rel="stylesheet" href="./assets/styles/login.css">
  <link rel="stylesheet" href="./assets/styles/fonts.css">
  <link rel="stylesheet" href="./assets/styles/loginResponsive.css">
  <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon" />

  <script src="./assets/js/login.js"></script>
  <script src="./assets/js/db.login.js"></script>
</head>

<body>
  <div class="startOverlay" id="startOverlay">
    <img src="./assets/icons/Capa 2.svg" class="animationLogo" alt="Logo">
</div>
  <div class="navLogIn">
    <div id="logo-container" class="logo">
      <img id="logo" src="./assets/icons/Capa 2.svg" alt="Logo" />
    </div>
    <div class="NotAJoinUser-box">
      <p class="f2">Not a Join user?</p><button onclick="navigateToSignUp()" class="login-box-button">Sign Up</button>
    </div>
  </div>
  <div class="flexCenter">
    <div class="container">
      <div class="login-box">
        <h2 class="f1 loginFont">Log in</h2>
        <form>
          <input class="inputBorder" id="inputMail" type="email" placeholder="Email">
          <input class="inputBorder" id="inputLock" type="password" placeholder="Password">
          <div><p id="dialogLogin" class="dialogLogin dNone">Email and password do not match our records.</p></div>
          <div class="loginBtn">
            <button onclick="login(); return false;" class="login-box-button f6" type="submit">Log
              in</button>
            <button onclick="loginAsGuest(); return false;" type="button" class="login-box-button2 f6">Guest Log
              in</button>
          </div>
          
        </form>
      </div>
    </div>
  </div>
  <div class="NotAJoinUser-boxRes">
    <p class="f2">Not a Join user?</p><button onclick="navigateToSignUp()" class="login-box-button">Sign Up</button>
  </div>
  <footer>
    <a href="privacy_policy.html">Privacy Policy</a> <a href="legal_notice.html">Legal notice</a>
    <footer>

</body>

</html>
