<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join</title>
    <link rel="stylesheet" href="./assets/styles/login.css">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <script src="./script/login.js"></script>
  </head>

  <body>
    <div class="navLogIn">
    <div class="logo">
      <img src="./assets/icons/Capa 2.png" alt="Logo" />
    </div>
    <div class="NotAJoinUser-box">
        <p class="f2">Not a Join user?</p><button onclick="navigateToSignUp()" class="login-box-button">Sign Up</button>
    </div>
</div>
    <div class="container">
      <div class="login-box">
        <h2 class="f1 loginFont">Log in</h2>
        <form>
          <input id="inputMail" type="email" placeholder="Email">
          <input id="inputLock" type="password" placeholder="Password">
          <div class="loginBtn">
          <button class="login-box-button f6" type="submit">Log in</button>
          <button type="button" class="login-box-button2 f6">Guest Log in</button>
        </div>
        </form>
    </div>
</div>
      <footer>
        <a href="#">Privacy Policy</a>  <a href="#">Legal notice</a>
      <footer>

  </body>
</html>
