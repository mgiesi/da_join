<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>

    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <link rel="stylesheet" href="./assets/styles/style.css">
    <link rel="stylesheet" href="./assets/styles/components.css">
    <link rel="stylesheet" href="./assets/styles/layout.css">

    <link rel="stylesheet" href="./assets/styles/summary.css">

    <script src="./assets/js/script.js"></script>
    <script src="./assets/js/db.js"></script>
    <script src="./assets/js/db.board.js"></script>
    <script src="./assets/js/summary.js"></script>
</head>

<body onload="init(); initSummary()">
    <header w3-include-html=".\assets\templates\header.html"></header>
    <div class="main-container">
        <div w3-include-html=".\assets\templates\side-menu.html"></div>

        <div class="summary-content">
            <div class="summary-title d-flex align-items-center">
                <span class="f1">Join 360</span>
                <div class="summary-vrule-blue"></div>
                <span class="f4">Key Metrics at a Glance</span>
            </div>
            <div class="d-flex justify-content-start align-items-center">
                <div class="summary-box-content">
                    <div class="d-flex">
                        <div class="summary-box summary-box-1 rd-box">
                            <div class="summary-box-icon bgc-gray d-flex justify-content-center align-items-center">
                                <img src="./assets/icons/edit_white.svg" alt="To-Do">
                            </div>
                            <div class="summary-box-text">
                                <span id="summary-taskscount-todo" class="f5">1</span>
                                <span class="f2">To-do</span>
                            </div>
                        </div>
                        <div class="summary-box summary-box-1 rd-box">
                            <div class="summary-box-icon bgc-gray d-flex justify-content-center align-items-center">
                                <img src="./assets/icons/done.svg" alt="Done">
                            </div>
                            <div class="summary-box-text">
                                <span id="summary-taskscount-done" class="f5">1</span>
                                <span class="f2">Done</span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex">
                        <div class="summary-box summary-box-2 rd-box">
                            <div class="summary-box-icon bgc-red d-flex justify-content-center align-items-center">
                                <img src="./assets/icons/prio-urgent-white.svg" alt="Urgent">
                            </div>
                            <div class="summary-box-text">
                                <span class="f5">1</span>
                                <span class="f3">Urgent</span>
                            </div>
                            <div class="summary-vrule-gray"></div>
                            <div class="summary-box-deadline">
                                <span class="f6">Februar 16, 2025</span>
                                <span class="f3">Upcoming Deadline</span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex">
                        <div class="summary-box summary-box-3 rd-box">
                            <div class="summary-box-text">
                                <span id="summary-taskscount-board"class="f5">5</span>
                                <span class="f2 text-center">Tasks in Board</span>
                            </div>
                        </div>
                        <div class="summary-box summary-box-3 rd-box">
                            <div class="summary-box-text">
                                <span id="summary-taskscount-inprogress"class="f5">2</span>
                                <span class="f2 text-center">Tasks in Progress</span>
                            </div>
                        </div>
                        <div class="summary-box summary-box-3 rd-box">
                            <div class="summary-box-text">
                                <span id="summary-taskscount-awaitingfeedback"class="f5">2</span>
                                <span class="f2 text-center">Awaiting Feedback</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="summary-greeting">
                    <span id="summary-greeting-text" class="f7">Good morning,</span>
                    <span id="summary-greeting-name" class="f8 tc-blue">Markus Giesinger</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
