<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join</title>
    <link rel="stylesheet" href="./assets/styles/login.css">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <script src="./assets/js/login.js"></script>
  </head>

  <body>
    <div class="navLogIn">
    <div class="logo">
      <img id="logo" src="./assets/icons/Capa 2.svg" alt="Logo" />
    </div>
</div>
<div class="overlay dNone" id="overlay">
  <div class="message">
    You signed up successfully
  </div>
</div>
<div class="flexCenter">
    <div class="container">
      <div class="login-box borderSign">
        <div class="topBox">
        <img class="imgArrow" onclick="navigateToIndex()" src="./assets/icons/arrow-left-line.svg" alt="">
        <h2 class="f1 loginFont">Sign up</h2></div>
        <div class="formWidth">
          <input id="inputName" type="text" required placeholder="Name">
          <input id="inputMail" type="text" required placeholder="Email">
          <input id="inputLock" type="password" required placeholder="Password">
          <input id="inputConfirm" type="password" required placeholder="Confirm Password">
          <div class="underSignUp">
          <div class="checkBoxPP"> <input id="checkbox" type="checkbox"><p>I accept the <a href="privacy_policy.html">Privacy Policy</a></p></div> 
          <div id="dialogSignUp" class="dNone dialogSignUp">You need to accept the Privacy Policy to proceed.</div>
          <div id="FieldsSignUp" class="dNone dialogSignUp">You need to fill all Fields.</div>
          <div id="passwordSignUp" class="dNone dialogSignUp">The passwords you entered do not match. Please try again.</div>
          <button onclick="addUser()" class="f6 signUpBtn">Sign up</button>
        </div>
      </div>
    </div>
    </div>
</div>
      <footer class="footerSignUp">
        <a href="privacy_policy.html">Privacy Policy</a>  <a href="legal_notice.html">Legal notice</a>
      <footer>

  </body>
</html>
