<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task - Join</title>

    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="./assets/styles/style.css">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <link rel="stylesheet" href="./assets/styles/components.css">
    <link rel="stylesheet" href="./assets/styles/layout.css">

    <link rel="stylesheet" href="./assets/styles/addTask.css">
    <link rel="stylesheet" href="./assets/styles/subtask-form.css">
    <link rel="stylesheet" href="./assets/styles/calendar.css">

    <script src="./assets/js/script.js"></script>
    <script src="./assets/js/subtask-form.js"></script>
</head>

<body onload="init()">
    <header w3-include-html=".\assets\templates\header.html"></header>

    <div class="main-container">
        <div w3-include-html=".\assets\templates\side-menu.html"></div>

        <main class="add-task-content">
            <div class="add-task-header">
                <h1>Add Task</h1>
            </div>

            <form class="add-task-form">
                <div class="form-columns">
                    <div class="form-left-column">
                        <div class="form-group">
                            <label for="title">Title<span class="required">*</span></label>
                            <input type="text" id="title" placeholder="Enter a title" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" placeholder="Enter a Description"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="assigned">Assigned to</label>
                            <div class="select-wrapper">
                                <select id="assigned">
                                    <option value="">Select contacts to assign</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="separator"></div>

                    <div class="form-right-column">
                        <div class="form-group">
                            <label for="dueDate">Due date<span class="required">*</span></label>
                            <div class="date-input-wrapper">
                                <input type="text" id="dueDate" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}"
                                    required maxlength="10" inputmode="numeric">
                                <img src="./assets/icons/calendar.svg" alt="Calendar" class="calendar-icon">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Prio</label>
                            <div class="priority-buttons">
                                <button type="button" class="priority-btn" data-priority="urgent">
                                    Urgent
                                    <img src="./assets/icons/prio-urgent.svg" alt="Urgent priority">
                                </button>
                                <button type="button" class="priority-btn" data-priority="medium">
                                    Medium
                                    <img src="./assets/icons/prio-medium.svg" alt="Medium priority">
                                </button>
                                <button type="button" class="priority-btn" data-priority="low">
                                    Low
                                    <img src="./assets/icons/prio-low.svg" alt="Low priority">
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="category">Category<span class="required">*</span></label>
                            <div class="select-wrapper">
                                <select id="category" required>
                                    <option value="">Select task category</option>
                                    <option value="work">Technical Task</option>
                                    <option value="personal">User Story</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Subtasks</label>
                            <div class="subtask-input">
                                <div class="input-wrapper">
                                    <input type="text" id="subtaskInput" placeholder="Add new subtask">
                                    <div class="subtask-actions">

                                        <div class="plus-icon">
                                            <svg width="25" height="24" viewBox="0 0 25 24" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <mask id="mask0_75601_14749" style="mask-type:alpha"
                                                    maskUnits="userSpaceOnUse" x="0" y="0" width="25" height="24">
                                                    <rect x="0.144531" width="24" height="24" fill="#D9D9D9" />
                                                </mask>
                                                <g mask="url(#mask0_75601_14749)">
                                                    <path
                                                        d="M11.1445 13H6.14453C5.8612 13 5.6237 12.9042 5.43203 12.7125C5.24036 12.5208 5.14453 12.2833 5.14453 12C5.14453 11.7167 5.24036 11.4792 5.43203 11.2875C5.6237 11.0958 5.8612 11 6.14453 11H11.1445V6C11.1445 5.71667 11.2404 5.47917 11.432 5.2875C11.6237 5.09583 11.8612 5 12.1445 5C12.4279 5 12.6654 5.09583 12.857 5.2875C13.0487 5.47917 13.1445 5.71667 13.1445 6V11H18.1445C18.4279 11 18.6654 11.0958 18.857 11.2875C19.0487 11.4792 19.1445 11.7167 19.1445 12C19.1445 12.2833 19.0487 12.5208 18.857 12.7125C18.6654 12.9042 18.4279 13 18.1445 13H13.1445V18C13.1445 18.2833 13.0487 18.5208 12.857 18.7125C12.6654 18.9042 12.4279 19 12.1445 19C11.8612 19 11.6237 18.9042 11.432 18.7125C11.2404 18.5208 11.1445 18.2833 11.1445 18V13Z"
                                                        fill="#2A3647" />
                                                </g>
                                            </svg>
                                        </div>

                                        <div class="edit-actions">
                                            <img src="./assets/icons/subTsk_cancel.svg" alt="Cancel" class="cancel-btn">
                                            <img src="./assets/icons/subTsk_check.svg" alt="Confirm"
                                                class="confirm-btn">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="subtasks-list"></div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary">
                        Clear
                        <img class="action-btn-img" src="./assets/icons/cancel.svg" alt="Clear form">
                    </button>
                    <button type="submit" class="btn-primary">
                        Create Task
                        <img src="./assets/icons/check.svg" alt="Create task">
                    </button>
                </div>
                <div class="required-note">
                    <span class="required">*</span><span class="span_txt">This field is required</span>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
